<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <style>
      .ln{stroke:#475569;stroke-width:2.2;fill:none}
      .pl{stroke:#94a3b8;stroke-width:2.2;fill:none;stroke-dasharray:7 5}
      .ip{stroke:#d97706;stroke-width:2.2;fill:none;stroke-dasharray:7 5}
      .lane-t{font-size:19px;font-weight:800}
      .q{font-size:14px;font-style:italic;fill:#475569}
      .chip{font-size:14px;font-weight:600;text-anchor:middle}
      .t{font-size:19px;font-weight:700;fill:#0f172a}
      .tp{font-size:19px;font-weight:700;fill:#475569}
      .s{font-size:14px;fill:#334155}
      .pill{font-size:12.5px;font-weight:700;text-anchor:middle}
      .cap{font-size:12.5px;font-weight:800;letter-spacing:1.2px;fill:#334155}
    </style>
  </defs>

  <rect width="960" height="580" rx="16" fill="#ffffff"/>

  <!-- ================= MONITORED INFRASTRUCTURE ================= -->
  <rect x="16" y="14" width="928" height="56" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="34" y="47" class="cap">MONITORED</text>
  <g font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">
    <rect x="140" y="28" width="112" height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="196" y="47">Proxmox Hosts</text>
    <rect x="260" y="28" width="86"  height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="303" y="47">Linux VMs</text>
    <rect x="354" y="28" width="150" height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="429" y="47">Docker Containers</text>
    <rect x="512" y="28" width="114" height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="569" y="47">Cisco Network</text>
    <rect x="634" y="28" width="80"  height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="674" y="47">Firewall</text>
    <rect x="722" y="28" width="112" height="28" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="778" y="47">NAS / Storage</text>
    <rect x="842" y="28" width="88"  height="28" rx="14" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="886" y="47" fill="#475569">Azure</text>
  </g>

  <!-- ================= LINKS ================= -->
  <path d="M165 70 V98" class="ln" marker-end="url(#a)"/>
  <path d="M480 70 V98" class="ln" marker-end="url(#a)"/>
  <path d="M795 70 V98" class="pl" marker-end="url(#ag)"/>
  <!-- Prometheus -> Grafana -->
  <path d="M480 384 V446" class="ln" marker-end="url(#a)"/>
  <!-- Prometheus -> Alertmanager -->
  <path d="M400 384 V420 H165 V446" class="ip" marker-end="url(#aa)"/>
  <!-- Loki -> Grafana -->
  <path d="M795 384 V420 H700 V446" class="pl" marker-end="url(#ag)"/>
  <!-- Azure Monitor -> Grafana -->
  <path d="M764 490 H748" class="pl" marker-end="url(#ag)"/>

  <!-- ================= LANE 1 · AVAILABILITY ================= -->
  <rect x="16" y="100" width="298" height="300" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="165" y="130" text-anchor="middle" class="lane-t" fill="#15803d">Availability</text>
  <text x="165" y="151" text-anchor="middle" class="q">Is it up?</text>
  <g>
    <rect x="28"  y="166" width="133" height="30" rx="8" fill="#fff" stroke="#86efac"/><text x="94.5"  y="186" class="chip" fill="#166534">HTTP</text>
    <rect x="169" y="166" width="133" height="30" rx="8" fill="#fff" stroke="#86efac"/><text x="235.5" y="186" class="chip" fill="#166534">TCP</text>
    <rect x="28"  y="206" width="133" height="30" rx="8" fill="#fff" stroke="#86efac"/><text x="94.5"  y="226" class="chip" fill="#166534">Ping</text>
    <rect x="169" y="206" width="133" height="30" rx="8" fill="#fff" stroke="#86efac"/><text x="235.5" y="226" class="chip" fill="#166534">DNS</text>
  </g>
  <g transform="translate(28,308)">
    <rect width="274" height="76" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.6"/>
    <rect width="6" height="76" rx="3" fill="#16a34a"/>
    <text x="20" y="32" class="t">Uptime Kuma</text>
    <text x="20" y="56" class="s">Service availability</text>
    <rect x="178" y="14" width="84" height="22" rx="11" fill="#dcfce7"/><text x="220" y="29.5" class="pill" fill="#15803d">Operational</text>
  </g>

  <!-- ================= LANE 2 · METRICS ================= -->
  <rect x="331" y="100" width="298" height="300" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="480" y="130" text-anchor="middle" class="lane-t" fill="#c2410c">Metrics</text>
  <text x="480" y="151" text-anchor="middle" class="q">How is it performing?</text>
  <g>
    <rect x="343" y="166" width="133" height="30" rx="8" fill="#fff" stroke="#fdba74"/><text x="409.5" y="186" class="chip" fill="#9a3412">Node Exporter</text>
    <rect x="484" y="166" width="133" height="30" rx="8" fill="#fff" stroke="#fdba74"/><text x="550.5" y="186" class="chip" fill="#9a3412">cAdvisor</text>
    <rect x="343" y="206" width="133" height="30" rx="8" fill="#fff" stroke="#fdba74"/><text x="409.5" y="226" class="chip" fill="#9a3412">SNMP Exporter</text>
    <rect x="484" y="206" width="133" height="30" rx="8" fill="#fff" stroke="#fdba74"/><text x="550.5" y="226" class="chip" fill="#9a3412">Blackbox Exporter</text>
  </g>
  <g transform="translate(343,308)">
    <rect width="274" height="76" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.6"/>
    <rect width="6" height="76" rx="3" fill="#ea580c"/>
    <text x="20" y="32" class="t">Prometheus</text>
    <text x="20" y="56" class="s">Time-series metrics</text>
    <rect x="178" y="14" width="84" height="22" rx="11" fill="#dcfce7"/><text x="220" y="29.5" class="pill" fill="#15803d">Operational</text>
  </g>

  <!-- ================= LANE 3 · EVENTS & LOGS ================= -->
  <rect x="646" y="100" width="298" height="300" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="795" y="130" text-anchor="middle" class="lane-t" fill="#6d28d9">Events &amp; Logs</text>
  <text x="795" y="151" text-anchor="middle" class="q">What happened?</text>
  <g>
    <rect x="658" y="166" width="133" height="30" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="724.5" y="186" class="chip" fill="#475569">Syslog</text>
    <rect x="799" y="166" width="133" height="30" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="865.5" y="186" class="chip" fill="#475569">Grafana Alloy</text>
  </g>
  <g transform="translate(658,308)">
    <rect width="274" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="20" y="32" class="tp">Loki</text>
    <text x="20" y="56" class="s">Centralized logs &amp; events</text>
    <rect x="178" y="14" width="84" height="22" rx="11" fill="#e2e8f0"/><text x="220" y="29.5" class="pill" fill="#475569">Planned</text>
  </g>

  <!-- in-lane flows (drawn above lane fills) -->
  <path d="M165 244 V306" class="ln" marker-end="url(#a)"/>
  <path d="M480 244 V306" class="ln" marker-end="url(#a)"/>
  <path d="M795 204 V306" class="pl" marker-end="url(#ag)"/>

  <!-- ================= BOTTOM ROW ================= -->
  <!-- Alertmanager -->
  <g transform="translate(16,448)">
    <rect width="298" height="84" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 5"/>
    <rect width="6" height="84" rx="3" fill="#d97706"/>
    <text x="20" y="34" class="t">Alertmanager</text>
    <text x="20" y="60" class="s">Alert routing &amp; notifications</text>
    <rect x="198" y="16" width="86" height="22" rx="11" fill="#fef3c7"/><text x="241" y="31.5" class="pill" fill="#b45309">In progress</text>
  </g>
  <!-- Grafana -->
  <g transform="translate(331,448)">
    <rect width="415" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect width="6" height="84" rx="3" fill="#2563eb"/>
    <text x="20" y="34" class="t">Grafana</text>
    <text x="20" y="60" class="s">Visualization &amp; correlation · <tspan font-style="italic" fill="#475569">How does it all relate?</tspan></text>
    <rect x="317" y="16" width="84" height="22" rx="11" fill="#dcfce7"/><text x="359" y="31.5" class="pill" fill="#15803d">Operational</text>
  </g>
  <!-- Azure Monitor -->
  <g transform="translate(766,448)">
    <rect width="178" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="16" y="32" class="tp" font-size="18">Azure Monitor</text>
    <text x="16" y="54" class="s">Cloud telemetry</text>
    <rect x="16" y="62" width="70" height="16" rx="8" fill="#e2e8f0"/><text x="51" y="74" font-size="11.5" font-weight="700" text-anchor="middle" fill="#475569">Planned</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(16,550)" font-size="13" fill="#334155">
    <line x1="0" y1="10" x2="28" y2="10" class="ln"/><text x="36" y="14">Operational</text>
    <line x1="130" y1="10" x2="158" y2="10" class="ip"/><text x="166" y="14">In progress</text>
    <line x1="262" y1="10" x2="290" y2="10" class="pl"/><text x="298" y="14">Planned</text>
  </g>
  <text x="944" y="564" text-anchor="end" font-size="12.5" font-weight="600" fill="#64748b">EC-HOMELAB</text>
</svg>
