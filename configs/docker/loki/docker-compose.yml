# source: https://github.com/grafana/loki
# source: https://grafana.com/docs/loki/v3.7.x/setup/install/docker/
# loki-config.yml example - https://grafana.com/docs/loki/latest/configure/examples/configuration-examples/
#
# networks assumes there is an existing docker network "monitoring"

services:
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped

    networks:
      - monitoring

    ports:
      - "3100:3100"

    volumes:
      - ./loki-config.yaml:/mnt/config/loki-config.yaml:ro
      - loki-data:/loki

    command:
      - "-config.file=/mnt/config/loki-config.yaml"

volumes:
  loki-data:

networks:
  monitoring:
    external: true
