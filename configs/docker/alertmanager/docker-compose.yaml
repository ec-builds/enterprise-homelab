# source: https://github.com/grafana/prometheus-alertmanager-tutorial/blob/main/docker-compose.yaml
# source: https://github.com/grafana/prometheus-alertmanager-tutorial/blob/main/alertmanager/alertmanager.yml
# source: https://hub.docker.com/r/prom/alertmanager
#
# Assumes an existing external Docker network named "monitoring"
#
# Before deployment: ensure gmail-app-password file exists in the alertmanager directory where docker-compose is running

services:
  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    restart: unless-stopped

    networks:
      - monitoring

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - ./gmail-app-password:/run/secrets/gmail-app-password:ro

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"

networks:
  monitoring:
    external: true
