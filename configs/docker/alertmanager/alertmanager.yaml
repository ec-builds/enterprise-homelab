# source: https://github.com/grafana/prometheus-alertmanager-tutorial/blob/main/alertmanager/alertmanager.yml
# source: https://prometheus.io/docs/alerting/latest/configuration/
#
# Email notifications via Gmail SMTP are currently configured.
# Replace the mail receiver with the webhook example below if webhook
# notifications are preferred instead.

route:
  receiver: mail
  repeat_interval: 12h

  # Group alerts with the same alert name into one notification.
  group_by:
    - alertname

receivers:
  - name: mail
    email_configs:
      - smarthost: "smtp.gmail.com:587"
        auth_username: "your_mail@gmail.com"
        auth_password_file: "/run/secrets/gmail-app-password"
        from: "your_mail@gmail.com"
        to: "some_mail@gmail.com"
        send_resolved: true


