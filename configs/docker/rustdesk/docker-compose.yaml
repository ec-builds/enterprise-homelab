# RustDesk Server OSS
# Source: https://rustdesk.com/docs/en/self-host/rustdesk-server-oss/docker/
#
# -k _ disables client key verification. Acceptable here because the server is
# reachable only over the VPN; remove the flag to require the key in data/id_ed25519.pub.

services:
  hbbs:
    container_name: rustdesk-hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs -k _
    volumes:
      - ./data:/root
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: rustdesk-hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr -k _
    volumes:
      - ./data:/root
    ports:
      - "21117:21117/tcp"
    restart: unless-stopped
