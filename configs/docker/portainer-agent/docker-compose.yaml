# source: https://docs.portainer.io/admin/environments/add/docker/agent

services:
  portainer-agent:
    image: portainer/agent:2.45.1
    container_name: portainer-agent
    restart: always

    ports:
      - "9001:9001"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

    networks:
      - portainer-agent

networks:
  portainer-agent:
    name: portainer-agent
    driver: bridge
