# source: https://github.com/prometheus/blackbox_exporter
# source: https://hub.docker.com/r/prom/blackbox-exporter
#
# Prometheus Blackbox Exporter
#
# Probes endpoints over HTTP, HTTPS, TCP, ICMP, DNS, and gRPC.
#
# Web UI / exporter metrics:
#   http://<docker-host-ip>:9115
#
# Test an HTTP probe:
#   http://<docker-host-ip>:9115/probe?target=https://example.com&module=http_2xx
#
# Successful probes return:
#   probe_success 1

services:
  blackbox-exporter:
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:0.28.0
    restart: unless-stopped

    networks:
      - monitoring

    ports:
      - "9115:9115"

    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro

    command:
      - '--config.file=/config/blackbox.yml'

networks:
  monitoring:
    external: true
