# source: https://gethomepage.dev/installation/docker/
# source: https://gethomepage.dev/configs/docker/
# Update HOMEPAGE_ALLOWED_HOSTS before deploying

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./config:/app/config
      - ./config/images:/app/public/images

    environment:
      HOMEPAGE_ALLOWED_HOSTS: docker-lab-01.lab.example.com:3000,homepage.lab.example.com:3000

    networks:
      - homepage

networks:
  homepage:
    name: homepage
