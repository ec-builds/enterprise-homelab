# source: https://hub.docker.com/r/prom/snmp-exporter
# source: https://github.com/prometheus/snmp_exporter
#
# Prometheus SNMP Exporter
#
# Converts SNMP data from network devices into Prometheus metrics.
#
# Exporter UI / self-metrics:
#   http://<docker-host-ip>:9116
#   http://<docker-host-ip>:9116/metrics

services:
  snmp-exporter:
    container_name: snmp-exporter
    image: prom/snmp-exporter:v0.30.1
    restart: unless-stopped

    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
      - "--config.file=/etc/snmp_exporter/snmp-auth.yml"
      - "--config.expand-environment-variables"

    environment:
      SNMP_AUTH_PASSWORD: ${SNMP_AUTH_PASSWORD}
      SNMP_PRIV_PASSWORD: ${SNMP_PRIV_PASSWORD}

    volumes:
      - ./snmp.yml:/etc/snmp_exporter/snmp.yml:ro
      - ./snmp-auth.yml:/etc/snmp_exporter/snmp-auth.yml:ro

    networks:
      - monitoring

    ports:
      - "9116:9116"

networks:
  monitoring:
    external: true
