# source: https://prometheus.io/docs/prometheus/latest/installation/#using-docker
# loki-config.yml example - https://grafana.com/docs/loki/latest/configure/examples/configuration-examples/
#
# networks assumes there is an existing docker network "monitoring"
#
# Important: Prometheus defaults to /etc/prometheus/prometheus.yml inside the container.
# The host configuration file may use .yaml, but it must be mounted to prometheus.yml.

services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped

    networks:
      - monitoring
    
    ports:
      - "9090:9090"
      
    volumes:
      # Relative to this Compose file: /opt/docker/prometheus/prometheus.yaml
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:

networks:
  monitoring:
    external: true
