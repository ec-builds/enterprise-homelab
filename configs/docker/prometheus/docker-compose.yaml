# source: https://prometheus.io/docs/prometheus/latest/installation/#using-docker
#
# Assumes an existing external Docker network named "monitoring".
#
# Prometheus defaults to /etc/prometheus/prometheus.yml inside the container.
# The host configuration file may use .yaml, but it must be mounted to
# /etc/prometheus/prometheus.yml.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped

    networks:
      - monitoring

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./data:/prometheus

networks:
  monitoring:
    external: true
